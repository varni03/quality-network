services:
  - type: web
    name: uveye-quality-intelligence
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Optional: set ANTHROPIC_API_KEY in the Render dashboard to enable Claude mode.
      # Leave unset to run the built-in local analytics engine (recommended for demos).
